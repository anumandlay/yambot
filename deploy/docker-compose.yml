# YamBot VPS stack: Mongo + Qdrant (Mem0) + API + Web + auto computer-manager
# Secrets: deploy/.env on the server only

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - yambot_mongo:/data/db

  # Why: Mem0 OSS vector store — keeps long-term memory on our VPS (not mem0 cloud).
  qdrant:
    # Why: keep near JS client 1.19 (compose previously used 1.13 → hard incompat).
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    volumes:
      - yambot_qdrant:/qdrant/storage
    # Internal only — API reaches it on the compose network.
    expose:
      - "6333"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://bot.vughy.com}
    restart: unless-stopped
    # Why: host Caddy owns :80/:443 and reverse-proxies to :8080 (bot.vughy.com).
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/yambot
      PORT: "4000"
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://bot.vughy.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://bot.vughy.com,http://bot.vughy.com}
      DEFAULT_LLM_BASE_URL: ${DEFAULT_LLM_BASE_URL:-https://api.minimax.io/v1}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-MiniMax-M2.7}
      DEFAULT_LLM_API_KEY: ${DEFAULT_LLM_API_KEY:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      JEV_ENABLED: ${JEV_ENABLED:-}
      JEV_MODEL: ${JEV_MODEL:-typesafe-ai/jev}
      COMPUTER_MANAGER_URL: http://computer-manager:4050
      MEM0_ENABLED: ${MEM0_ENABLED:-1}
      MEM0_QDRANT_URL: http://qdrant:6333
      MEM0_COLLECTION: ${MEM0_COLLECTION:-yambot_memories}
      MEM0_LLM_API_KEY: ${MEM0_LLM_API_KEY:-}
      MEM0_LLM_BASE_URL: ${MEM0_LLM_BASE_URL:-}
      MEM0_LLM_MODEL: ${MEM0_LLM_MODEL:-}
      MEM0_EMBEDDER_MODEL: ${MEM0_EMBEDDER_MODEL:-fast-bge-small-en-v1.5}
      MEM0_EMBEDDER_PROVIDER: ${MEM0_EMBEDDER_PROVIDER:-fastembed}
      MEM0_EMBEDDING_DIMS: ${MEM0_EMBEDDING_DIMS:-384}
    ports:
      - "4010:4000"
    depends_on:
      mongo:
        condition: service_started
      qdrant:
        condition: service_started

  # Builds the Playwright worker image used by computer-manager for each agent box.
  worker-image:
    image: yambot-worker:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    entrypoint: ["/bin/true"]
    restart: "no"

  # Optional Cua XFCE desktop image (Agent → Desktop engine = Cua). ~4GB RAM per box.
  worker-cua-image:
    image: yambot-cua:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.cua-worker
    entrypoint: ["/bin/true"]
    restart: "no"

  # Watches Mongo and starts/stops one Chromium worker container per cloud agent.
  computer-manager:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.manager
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/yambot
      YAMBOT_API_BASE_URL: http://api:4000
      WORKER_IMAGE: yambot-worker:local
      CUA_WORKER_IMAGE: yambot-cua:local
      CUA_WORKER_MEM_LIMIT: "4294967296"
      # Compose project directory name is `deploy` → network `deploy_default`
      DOCKER_NETWORK: ${DOCKER_NETWORK:-deploy_default}
      MANAGER_POLL_MS: "8000"
      MANAGER_HTTP_PORT: "4050"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mongo:
        condition: service_started
      api:
        condition: service_started
      worker-image:
        condition: service_completed_successfully
      worker-cua-image:
        condition: service_completed_successfully

volumes:
  yambot_mongo:
  yambot_qdrant:
