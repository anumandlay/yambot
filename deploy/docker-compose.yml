# YamBot VPS stack: Mongo + API + Web + auto computer-manager
# Secrets: deploy/.env on the server only

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - yambot_mongo:/data/db

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://bot.vughy.com}
    restart: unless-stopped
    # Why: host Caddy owns :80/:443 and reverse-proxies to :8080 (bot.vughy.com).
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/yambot
      PORT: "4000"
      PUBLIC_API_URL: https://bot.vughy.com
      CORS_ORIGINS: https://bot.vughy.com,http://bot.vughy.com
      DEFAULT_LLM_BASE_URL: ${DEFAULT_LLM_BASE_URL:-https://api.minimax.io/v1}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-MiniMax-M2.7}
      DEFAULT_LLM_API_KEY: ${DEFAULT_LLM_API_KEY:-}
      LITELLM_PROXY_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_DEFAULT_MODEL: ${LITELLM_DEFAULT_MODEL:-minimax}
      MINIMAX_API_KEY: ${DEFAULT_LLM_API_KEY:-}
      COMPUTER_MANAGER_URL: http://computer-manager:4050
    ports:
      - "4010:4000"
    depends_on:
      mongo:
        condition: service_started
      litellm:
        condition: service_started

  postgres-litellm:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_PG_PASSWORD:-litellm-dev-password}
      POSTGRES_DB: litellm
    volumes:
      - yambot_litellm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 8

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_PG_PASSWORD:-litellm-dev-password}@postgres-litellm:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-}
      STORE_MODEL_IN_DB: "True"
      MINIMAX_API_KEY: ${DEFAULT_LLM_API_KEY:-}
    depends_on:
      postgres-litellm:
        condition: service_healthy

  # Builds the Playwright worker image used by computer-manager for each agent box.
  worker-image:
    image: yambot-worker:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    entrypoint: ["/bin/true"]
    restart: "no"

  # Watches Mongo and starts/stops one Chromium worker container per cloud agent.
  computer-manager:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.manager
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/yambot
      YAMBOT_API_BASE_URL: http://api:4000
      WORKER_IMAGE: yambot-worker:local
      # Compose project directory name is `deploy` → network `deploy_default`
      DOCKER_NETWORK: ${DOCKER_NETWORK:-deploy_default}
      MANAGER_POLL_MS: "8000"
      MANAGER_HTTP_PORT: "4050"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mongo:
        condition: service_started
      api:
        condition: service_started
      worker-image:
        condition: service_completed_successfully

volumes:
  yambot_mongo:
  yambot_litellm_pg:
