# YamBot VPS stack: Mongo + API + Web
# Secrets: deploy/.env on the server only

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - yambot_mongo:/data/db

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://bot.vughy.com}
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:80"
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/yambot
      PORT: "4000"
      PUBLIC_API_URL: https://bot.vughy.com
      CORS_ORIGINS: https://bot.vughy.com,http://bot.vughy.com
    ports:
      - "4010:4000"
    depends_on:
      - mongo

volumes:
  yambot_mongo:
