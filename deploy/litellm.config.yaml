# @fileoverview LiteLLM proxy config for YamBot VPS stack.
# Purpose: Central LLM gateway — MiniMax (platform key) + ChatGPT OAuth credentials per user via /model/new.
# Inputs: DATABASE_URL, LITELLM_MASTER_KEY, MINIMAX_API_KEY env vars in the litellm container.
# Downstream: YamBot API (virtual keys), Playwright workers (/v1/chat/completions).

model_list:
  - model_name: minimax
    litellm_params:
      model: openai/MiniMax-M2.7
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY

  - model_name: MiniMax-M2.7
    litellm_params:
      model: openai/MiniMax-M2.7
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY

  - model_name: chatgpt/gpt-5.3-codex
    model_info:
      mode: responses
    litellm_params:
      model: chatgpt/gpt-5.3-codex

  - model_name: chatgpt/gpt-5.4
    model_info:
      mode: responses
    litellm_params:
      model: chatgpt/gpt-5.4

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
